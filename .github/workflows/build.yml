name: Desktop CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional: publish this exact version (e.g. v0.1.2) after all checks; empty runs CI only"
        required: false
        default: ""
        type: string

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-plan:
    name: Validate release intent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate requested version against source
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const input = process.env.RELEASE_INPUT || "";
          const manual = process.env.GITHUB_EVENT_NAME === "workflow_dispatch" && input !== "";
          const tagged = process.env.GITHUB_EVENT_NAME === "push" && process.env.GITHUB_REF.startsWith("refs/tags/v");
          if (manual) assert.equal(process.env.GITHUB_REF, "refs/heads/main", "Manual publication requires main");
          if (manual || tagged) {
            const tag = manual ? input : process.env.GITHUB_REF.slice("refs/tags/".length);
            assert.match(tag, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
            const version = tag.slice(1);
            const read = file => fs.readFileSync(file, "utf8");
            const pkg = JSON.parse(read("package.json"));
            const lock = JSON.parse(read("package-lock.json"));
            const app = JSON.parse(read("src-tauri/tauri.conf.json"));
            const cargo = read("src-tauri/Cargo.toml").match(/name = "gitglade"\nversion = "([^"]+)"/);
            const cargoLock = read("src-tauri/Cargo.lock").match(/name = "gitglade"\nversion = "([^"]+)"/);
            for (const actual of [pkg.version, lock.version, lock.packages[""].version, app.version, cargo?.[1], cargoLock?.[1]]) {
              assert.equal(actual, version, "Release tag must match every application version");
            }
            console.log(`Validated ${tag} at ${process.env.GITHUB_SHA}`);
          } else console.log("CI only: no release requested");
          NODE

  check:
    name: Checks · ${{ matrix.platform }}
    needs: release-plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
          - os: macos-15-intel
            platform: mac-intel
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: check-${{ matrix.platform }}
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --tests
      - name: Prepare Git 2.36.1 for compatibility regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $legacyGitArchive = Join-Path $env:RUNNER_TEMP 'git-2.36.1.zip'
          $legacyGitDirectory = Join-Path $env:RUNNER_TEMP 'git-2.36.1'
          Invoke-WebRequest 'https://github.com/git-for-windows/git/releases/download/v2.36.1.windows.1/MinGit-2.36.1-64-bit.zip' -OutFile $legacyGitArchive
          $legacyGitDigest = (Get-FileHash -LiteralPath $legacyGitArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($legacyGitDigest -ne 'a7a78c306dea018cc7ca3efe6a0d87c1dd7a43762705ccb0c5e31e3e44349207') {
            throw 'Legacy Git archive digest does not match the official release'
          }
          Expand-Archive -LiteralPath $legacyGitArchive -DestinationPath $legacyGitDirectory
      - name: Verify history viewing with Git 2.36.1
        if: runner.os == 'Windows'
        env:
          GITGLADE_TEST_LEGACY_GIT: ${{ runner.temp }}/git-2.36.1/cmd/git.exe
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test lfs old_git_ -- --ignored

  bundle:
    name: Package · ${{ matrix.artifact }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            artifact: installers-macos-universal
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: installers-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundle-${{ matrix.target }}
      - run: npm ci
      - run: npm run package -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*setup.exe
          if-no-files-found: error
          retention-days: 14

  installed:
    name: Installed CLI · ${{ matrix.platform }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
            artifact: installers-macos-universal
          - os: macos-15-intel
            platform: mac-intel
            artifact: installers-macos-universal
          - os: windows-2022
            platform: windows-x64
            artifact: installers-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer
      - name: Install and verify the read-only CLI
        run: node scripts/ci-install-smoke.mjs --artifact-dir installer --report reports/${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-${{ matrix.platform }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_version != '' && github.ref == 'refs/heads/main')
    needs: installed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "installers-*"
          merge-multiple: true
          path: installers
      - name: Publish verified installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_version || github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tags must use vMAJOR.MINOR.PATCH\n' >&2
            exit 1
          fi
          shopt -s globstar nullglob
          mac_assets=(installers/**/*.dmg)
          windows_assets=(installers/**/*setup.exe)
          if (( ${#mac_assets[@]} != 1 || ${#windows_assets[@]} != 1 )); then
            printf 'Expected one macOS DMG and one Windows installer\n' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          if [[ "$(basename "${mac_assets[0]}")" != "GitGlade_${version}_universal.dmg" || "$(basename "${windows_assets[0]}")" != "GitGlade_${version}_x64-setup.exe" ]]; then
            printf 'Installer brand/version must match the release tag\n' >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "${mac_assets[0]}" "${windows_assets[0]}" release-assets/
          cd release-assets
          sha256sum ./*.dmg ./*setup.exe > SHA256SUMS.txt
          # Fail closed on API errors; never overwrite an existing release.
          published_tags="$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name')"
          if grep -Fxq "$RELEASE_TAG" <<< "$published_tags"; then
            printf 'Release already exists; refusing to overwrite\n' >&2
            exit 1
          fi
          if [[ "$MANUAL_RELEASE" == 'true' ]]; then
            # Creating a ref is atomic and fails if the tag already exists.
            # This happens only after checks, packaging and installed smoke tests.
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA"
          fi
          tagged_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')"
          if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
            printf 'Tag does not point at the tested commit; refusing publication\n' >&2
            exit 1
          fi
          release_notes="$(cat <<'NOTES'
          GitGlade 0.1.2 fixes historical diff viewing with Git versions that cannot query historical attributes. Regular committed content no longer receives an LFS warning solely because that Git capability is missing. Possible LFS pointers retain an explicit uncertainty notice, while text diffs honor the selected side-by-side or unified layout.

          Compatibility regressions run with actual Git for Windows 2.36.1 and emulated missing historical-attribute support on macOS. They verify that history reads leave repository files, index, refs and configuration unchanged. The app does not substitute working-tree attributes, run external conversions, or download LFS objects. Full historical LFS identification and protected branch updates still require Git with historical-attribute support.

          GitGlade 0.1.2 修复旧 Git 下的历史差异展示。普通提交内容不再仅因 Git 缺少历史属性查询能力而出现 LFS 警告；疑似 LFS 指针仍明确提示属性未知，文本差异遵循左右对照或统一布局选择。真实 Git for Windows 2.36.1 与 macOS 兼容回归验证保持仓库文件、索引、引用和配置不变。应用不使用当前工作区属性代替历史属性，不运行外部转换、不下载 LFS 对象。完整的历史 LFS 识别及受保护分支更新仍需支持历史属性查询的 Git。

          Original MIT copyright and third-party licenses are retained. Native-window interaction and platform signing warnings are separate from installed CLI verification.
          NOTES
          )"
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" --verify-tag \
            --title "GitGlade $RELEASE_TAG" --notes "$release_notes" --generate-notes \
            --draft=false --prerelease=false --latest \
            ./*.dmg ./*setup.exe SHA256SUMS.txt

  release-pages:
    name: Refresh download site
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
