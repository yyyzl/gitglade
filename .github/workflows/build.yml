name: Desktop CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks · ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
          - os: macos-15-intel
            platform: mac-intel
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: check-${{ matrix.platform }}
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --tests

  bundle:
    name: Package · ${{ matrix.artifact }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            artifact: mac-universal-test
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundle-${{ matrix.target }}
      - run: npm ci
      - run: npm run package -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*setup.exe
          if-no-files-found: error
          retention-days: 14

  installed:
    name: Installed CLI · ${{ matrix.platform }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
            artifact: mac-universal-test
          - os: macos-15-intel
            platform: mac-intel
            artifact: mac-universal-test
          - os: windows-2022
            platform: windows-x64
            artifact: windows-x64-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer
      - name: Install and verify the read-only CLI
        run: node scripts/ci-install-smoke.mjs --artifact-dir installer --report reports/${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-${{ matrix.platform }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: installed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-test"
          merge-multiple: true
          path: installers
      - name: Publish verified installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tags must use vMAJOR.MINOR.PATCH\n' >&2
            exit 1
          fi
          shopt -s globstar nullglob
          mac_assets=(installers/**/*.dmg)
          windows_assets=(installers/**/*setup.exe)
          if (( ${#mac_assets[@]} != 1 || ${#windows_assets[@]} != 1 )); then
            printf 'Expected one macOS DMG and one Windows installer\n' >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "${mac_assets[0]}" "${windows_assets[0]}" release-assets/
          cd release-assets
          sha256sum ./*.dmg ./*setup.exe > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" --verify-tag \
            --title "oil-git $RELEASE_TAG" --generate-notes \
            --draft=false --prerelease=false --latest \
            ./*.dmg ./*setup.exe SHA256SUMS.txt
